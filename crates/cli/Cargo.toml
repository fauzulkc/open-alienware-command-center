[package]
name = "cockpit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# `cockpit`: every Alien Cockpit OSS function from a terminal, on Windows and Linux, through the same code as
# the app (cockpit-core for settings, the emergency rule, the log; wiregent-hw's Machine for the hardware).

[[bin]]
name = "cockpit"
path = "src/main.rs"

[dependencies]
cockpit-core = { path = "../cockpit-core" }
wiregent-hw = { path = "../hw" }
wiregent-oem-alienware = { path = "../oem-alienware" }

anyhow.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
alienfx = { path = "../alienfx" }

[dev-dependencies]
tempfile.workspace = true
