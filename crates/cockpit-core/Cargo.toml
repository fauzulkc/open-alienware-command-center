[package]
name = "cockpit-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# What Alien Cockpit OSS and the `cockpit` command line share: settings and their validation, the emergency
# rule as the app runs it, the daily log, the AWCC lighting and game-library readers, the boost key's choice
# and the alert texts. No Tauri here. Windows-only parts (AWCC's files, the local clock) are gated, so this
# compiles on Linux too.

[dependencies]
wiregent-hw = { path = "../hw" }
wiregent-oem-alienware = { path = "../oem-alienware" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile.workspace = true
